<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat — Rincón de Fe y Amor</title>
  <meta name="theme-color" content="#e8547a">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css?v=20">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
</head>
<body>
  <div class="header">
    <button id="menuBtn">☰</button>
    <div class="header-center">Chat</div>
    <div class="header-right">
      <div class="avatar-small" id="headerAvatar">?</div>
    </div>
  </div>
  <div id="app" style="padding-bottom:80px"></div>
  <div class="chat-input-bar">
    <input id="encouragementInput" placeholder="Escribe un mensaje..." autocomplete="off">
    <button id="sendBtn" aria-label="Enviar"><i class="ti ti-send"></i></button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=6"></script>
  <script src="js/auth.js?v=17"></script>
  <script src="components/layout.js?v=14"></script>
  <script src="js/pages/encouragement-page.js?v=3"></script>
</body>
</html>
