<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro — Rincón de Fe y Amor</title>
  <meta name="theme-color" content="#e8547a">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
  <div class="auth-page" id="app">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-heart"></i></div>
      <h1>Crear cuenta</h1>
      <p>Únete a Rincón de Fe y Amor</p>
    </div>
    <div class="auth-form" id="authForm">
      <div class="input-group">
        <label class="input-label">Nombre</label>
        <input class="input-field" type="text" id="nameInput" placeholder="Tu nombre" autocomplete="name">
      </div>
      <div class="input-group">
        <label class="input-label">Correo electrónico</label>
        <input class="input-field" type="email" id="emailInput" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label class="input-label">Contraseña (mín. 6 caracteres)</label>
        <input class="input-field" type="password" id="passwordInput" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-primary w-full" id="registerBtn">Crear cuenta</button>
      <p id="magicSentMsg" style="display:none;text-align:center;color:var(--text-3);font-size:13px;margin-top:8px">
        <i class="ti ti-mail-check" style="color:var(--accent);font-size:16px;vertical-align:middle;margin-right:4px"></i>
        Revisa tu correo — al hacer clic en el enlace se activará tu cuenta
      </p>
      <div class="auth-link">
        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/pages/register.js?v=2"></script>
</body>
</html>
