<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Recuperar contraseña — Rincón de Fe y Amor</title>
  <meta name="theme-color" content="#e8547a">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="ti ti-lock"></i></div>
        <h1>Recuperar contraseña</h1>
        <p id="pageDescription">Te enviaremos un enlace para cambiarla</p>
      </div>

      <!-- Formulario para ENVIAR el correo -->
      <div class="auth-form" id="emailForm">
        <div class="input-group">
          <label class="input-label">Correo electrónico</label>
          <input class="input-field" type="email" id="emailInput" placeholder="tu@correo.com">
        </div>
        <button class="btn-primary w-full" id="sendRecoveryBtn">Enviar enlace</button>
        <div class="auth-link">
          <a href="index.html">Volver al inicio</a>
        </div>
      </div>

      <!-- Mensaje de éxito -->
      <p id="successMessage" style="display:none;text-align:center;color:#888;font-size:13px;margin-top:8px">
        ✅ Revisa tu correo
      </p>

      <!-- Formulario para CAMBIAR la contraseña (oculto al inicio) -->
      <div class="auth-form" id="resetPasswordForm" style="display:none;">
        <div class="input-group">
          <label class="input-label">Nueva contraseña</label>
          <input class="input-field" type="password" id="newPassword" placeholder="••••••••">
        </div>
        <div class="input-group">
          <label class="input-label">Confirmar contraseña</label>
          <input class="input-field" type="password" id="confirmPassword" placeholder="••••••••">
        </div>
        <button class="btn-primary w-full" id="updatePasswordBtn">Actualizar contraseña</button>
        <div class="auth-link">
          <a href="index.html">Volver al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type + ' show';
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenHash = urlParams.get('token_hash');
      const type = urlParams.get('type');

      const emailForm = document.getElementById('emailForm');
      const resetPasswordForm = document.getElementById('resetPasswordForm');
      const pageDescription = document.getElementById('pageDescription');
      const successMessage = document.getElementById('successMessage');

      // ============================================
      // CASO 1: VENIMOS DEL ENLACE DEL CORREO
      // ============================================
      if (tokenHash && type === 'recovery') {
        // Mostrar formulario de nueva contraseña
        emailForm.style.display = 'none';
        successMessage.style.display = 'none';
        resetPasswordForm.style.display = 'block';
        pageDescription.textContent = 'Escribe tu nueva contraseña';

        // 🔥 LA LÍNEA MÁGICA: convertir el token en sesión
        const { error: exchangeError } = await window.supabase.auth.exchangeCodeForSession(tokenHash);
        if (exchangeError) {
          showToast('Error al verificar el enlace: ' + exchangeError.message, 'error');
          return;
        }

        // Cambiar contraseña
        document.getElementById('updatePasswordBtn').addEventListener('click', async () => {
          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          if (!newPassword || !confirmPassword) {
            showToast('Completa ambos campos', 'error');
            return;
          }
          if (newPassword !== confirmPassword) {
            showToast('Las contraseñas no coinciden', 'error');
            return;
          }
          if (newPassword.length < 6) {
            showToast('Mínimo 6 caracteres', 'error');
            return;
          }

          const { error } = await window.supabase.auth.updateUser({ password: newPassword });

          if (error) {
            showToast(window.auth.translateError(error.message), 'error');
          } else {
            showToast('✅ Contraseña actualizada', 'success');
            setTimeout(() => window.location.href = 'index.html', 2000);
          }
        });
        return;
      }

      // ============================================
      // CASO 2: ENVIAR CORREO DE RECUPERACIÓN
      // ============================================
      document.getElementById('sendRecoveryBtn').addEventListener('click', async () => {
        const email = document.getElementById('emailInput').value.trim();
        if (!email) {
          showToast('Ingresa tu correo', 'error');
          return;
        }

        const btn = document.getElementById('sendRecoveryBtn');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        const { error } = await window.auth.sendRecoveryLink(email);

        if (error) {
          showToast(window.auth.translateError(error.message), 'error');
          btn.disabled = false;
          btn.textContent = 'Enviar enlace';
          return;
        }

        emailForm.style.display = 'none';
        successMessage.style.display = 'block';
        showToast('Enlace enviado', 'success');
      });
    });
  </script>
</body>
</html>
