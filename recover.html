<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Recuperar contraseña — Rincón de Fe y Amor</title>
  <meta name="theme-color" content="#e8547a">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page" id="app">
    <div class="auth-logo">
      <div class="logo-icon"><i class="ti ti-lock"></i></div>
      <h1>Recuperar contraseña</h1>
      <p>Te enviaremos un enlace para restablecerla</p>
    </div>
    <div class="auth-form" id="authForm">
      <div class="input-group">
        <label class="input-label">Correo electrónico</label>
        <input class="input-field" type="email" id="emailInput" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <button class="btn-primary w-full" id="recoverBtn">Enviar enlace</button>
      <div class="auth-link">
        <a href="index.html">Volver al inicio de sesión</a>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type + ' show';
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('emailInput');
      const recoverBtn = document.getElementById('recoverBtn');

      recoverBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) {
          showToast('Ingresa tu correo', 'error');
          return;
        }

        recoverBtn.disabled = true;
        recoverBtn.textContent = 'Enviando...';

        const { error } = await window.supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/index.html'
        });

        if (error) {
          showToast('Error: ' + error.message, 'error');
          recoverBtn.disabled = false;
          recoverBtn.textContent = 'Enviar enlace';
          return;
        }

        showToast('Enlace enviado ✓ Revisa tu correo', 'success');
        recoverBtn.textContent = 'Enviar enlace';
        recoverBtn.disabled = false;
      });

      emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') recoverBtn.click();
      });
    });
  </script>
</body>
</html>
