<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard — Rincón de Fe y Amor</title>
  <meta name="theme-color" content="#e8547a">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css?v=16">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>
  <div class="header">
    <button id="menuBtn">☰</button>
    <div class="header-center" id="headerDate"></div>
    <div class="header-right">
      <div class="notification-bell" id="notifBell"><i class="ti ti-bell" style="font-size:20px"></i><span class="notification-dot" id="notifBadge" style="display:none"></span></div>
      <div class="avatar-small" id="headerAvatar">?</div>
    </div>
  </div>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <div id="installBanner" class="install-banner" style="display:none">
    <div class="install-banner-content">
      <div class="install-banner-left">
        <div class="install-icon">📲</div>
        <div>
          <div class="install-title">Instalar app</div>
          <div class="install-sub">Accede más rápido desde tu pantalla de inicio</div>
        </div>
      </div>
      <button id="installBtn" class="install-btn">Instalar</button>
      <button id="dismissInstall" class="install-dismiss">✕</button>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=5"></script>
  <script src="js/auth.js?v=11"></script>
  <script src="js/devotional.js?v=1"></script>
  <script src="js/streak.js?v=2"></script>
  <script src="js/notifications.js?v=2"></script>
  <script src="components/layout.js?v=12"></script>
  <script src="js/pages/dashboard.js?v=14"></script>
</body>
</html>
